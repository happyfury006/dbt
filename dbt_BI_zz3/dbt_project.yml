
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_BI_zz3'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_BI_zz3'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Variables globales : taux de conversion vers l'euro
# Utilisation dans un modèle : {{ var('eur_rate_us') }}
vars:
  eur_rate_us: 0.89906    # US
  eur_rate_uk: 1.1777     # UK
  eur_rate_inde: 0.00926  # Inde

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
# Le schéma custom est utilisé tel quel grâce à macros/generate_schema_name.sql
# (bronze, silver, gold... et non dbt_bi_zz3_silver).
# Hooks : journal d'exécution dans training.dbt_execution_logs (macros/execution_logs.sql)
on-run-start:
  - "{{ create_execution_log_table() }}"

models:
  dbt_BI_zz3:
    +pre-hook: "{{ log_model_execution('start') }}"
    +post-hook: "{{ log_model_execution('end') }}"
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
    training:
      +materialized: table
      +schema: training

# Fichiers CSV de référence (dbt seed)
seeds:
  dbt_BI_zz3:
    +schema: bronze
    salestarget:
      +column_types:
        StoreID: int
        SalesTarget: decimal(12,2)

# Snapshots (SCD type 2)
snapshots:
  dbt_BI_zz3:
    +target_schema: snapshots

